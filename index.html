<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Валентинка ❤️</title>
  <style>
    body {
      background: #ffe6f2;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding-top: 40px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      max-width: 90%;
    }

    .heart {
      width: 80px;
      height: 80px;
      background: #e74c3c;
      margin: 0 auto 20px;
      border-radius: 50% 50% 0;
      transform: rotate(-45deg);
      position: relative;
    }
    .heart::before,
    .heart::after {
      content: "";
      width: 80px;
      height: 80px;
      background: #e74c3c;
      border-radius: 50%;
      position: absolute;
    }
    .heart::before {
      top: -40px;
      left: 0;
    }
    .heart::after {
      top: 0;
      left: 40px;
    }

    button {
      margin-top: 20px;
      padding: 10px 24px;
      font-size: 18px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #c0392b;
    }

    #card {
      opacity: 0;
      transform: translateY(100px); 
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      margin-top: 30px;
    }

    #card.show {
      opacity: 1;
      transform: translateY(0);
    }

    #card img {
      width: 120px;
      height: auto;
      border-radius: 10px;
      margin: 15px 0;
    }

    #card p {
      margin: 10px 0;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="heart"></div>
    <h2>С Днём Святого Валентина!</h2>
    <button onclick="revealCard()">Открыть валентинку</button>

    <div id="card">
      <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+PGNpcmNsZSBjeD0iMzAiIGN5PSIzMCIgcj0iMjAiIGZpbGw9IiNmNDQzMzYiLz48Y2lyY2xlIGN4PSI3MCIgY3k9IjMwIiByPSIyMCIgZmlsbD0iI2Y0NDMzNiIvPjxwYXRoIGQ9Ik0zMCw3MEw1MCw5MGw3MC03MFoiIHN0cm9rZT0iI2Y0NDMzNiIgc3Ryb2tlLXdpZHRoPSIyMCIgZmlsbD0ibm9uZSIvPjwvc3ZnPg==" alt="Сердце">
      <p><strong>От:</strong> Алексей</p>
      <p><strong>Кому:</strong> Настя ❤️</p>
    </div>
  </div>

  <script>
    function revealCard() {
      const card = document.getElementById('card');
      card.classList.add('show');
    }
  </script>
</body>
</html>
