<!DOCTYPE html> 
<html lang="ru"> 
<head> 
  <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"/> 
  <title>💖 Для Насти 💖</title> 
  <style> 
    /* СБРОС И БАЗА */ 
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    } 
 
    body { 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-family: 'Dancing Script', 'Segoe UI', cursive, sans-serif; 
      padding: 12px; 
      background: radial-gradient(circle at 30% 30%, #fff5fa, #ffd0e2); 
      position: relative; 
    } 
 
    /* ===== БОЛЬШОЕ БЬЮЩЕЕСЯ СЕРДЦЕ ===== */ 
    .giant-heart { 
      position: fixed; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%) scale(0); 
      font-size: 45vmin;  /* на телефоне будет крупно, но не агрессивно */ 
      z-index: 5; 
      pointer-events: none; 
      opacity: 0; 
      transition: opacity 0.8s ease; 
      filter: drop-shadow(0 0 30px #ff3388); 
      text-shadow: 0 0 40px #ff1493; 
      line-height: 1; 
    } 
 
    .giant-heart.beat { 
      opacity: 0.3; /* прозрачнее, чтобы текст читался */ 
      animation: giantHeartbeat 1.2s ease-in-out infinite; 
    } 
 
    @keyframes giantHeartbeat { 
      0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0.2; } 
      25% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.4; } 
      35% { transform: translate(-50%, -50%) scale(1.0); opacity: 0.35; } 
      45% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.45; } 
      55% { transform: translate(-50%, -50%) scale(1.0); opacity: 0.35; } 
      65% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.4; } 
      75% { transform: translate(-50%, -50%) scale(1.0); opacity: 0.35; } 
      100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.25; } 
    } 
 
    /* ===== АНИМИРОВАННЫЙ ФОН (сердечки помельче и пореже, чтобы не отвлекать) ===== */ 
    .floating-hearts { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 0; 
      pointer-events: none; 
      overflow: hidden; 
    } 
 
    .heart-emoji { 
      position: absolute; 
      bottom: -10%; 
      font-size: clamp(1.2rem, 7vw, 2.8rem); /* помельче для телефона */ 
      animation: floatUp 16s linear infinite; 
      user-select: none; 
      filter: drop-shadow(0 4px 8px rgba(255, 80, 150, 0.3)); 
      opacity: 0.3; 
    } 
 
    /* достаточно 12 сердечек, чтобы не перегружать */ 
    .heart-emoji:nth-child(1) { left: 5%; animation-duration: 14s; animation-delay: 0s; } 
    .heart-emoji:nth-child(2) { left: 15%; animation-duration: 18s; animation-delay: 2s; } 
    .heart-emoji:nth-child(3) { left: 25%; animation-duration: 16s; animation-delay: 1s; } 
    .heart-emoji:nth-child(4) { left: 35%; animation-duration: 20s; animation-delay: 3s; } 
    .heart-emoji:nth-child(5) { left: 45%; animation-duration: 15s; animation-delay: 0.5s; } 
    .heart-emoji:nth-child(6) { left: 55%; animation-duration: 22s; animation-delay: 2.5s; } 
    .heart-emoji:nth-child(7) { left: 65%; animation-duration: 17s; animation-delay: 1.8s; } 
    .heart-emoji:nth-child(8) { left: 75%; animation-duration: 19s; animation-delay: 4s; } 
    .heart-emoji:nth-child(9) { left: 85%; animation-duration: 21s; animation-delay: 0.2s; } 
    .heart-emoji:nth-child(10) { left: 95%; animation-duration: 23s; animation-delay: 3.2s; } 
    .heart-emoji:nth-child(11) { left: 10%; animation-duration: 25s; animation-delay: 5s; } 
    .heart-emoji:nth-child(12) { left: 50%; animation-duration: 18s; animation-delay: 1.2s; } 
 
    @keyframes floatUp { 
      0% { transform: translateY(0) rotate(0deg); opacity: 0.1; } 
      50% { transform: translateY(-50vh) rotate(8deg); opacity: 0.4; }
      100% { transform: translateY(-110vh) rotate(-5deg); opacity: 0; } 
    } 
 
    /* ===== ОСНОВНАЯ КАРТОЧКА ===== */ 
    .container { 
      position: relative; 
      z-index: 20; 
      background: rgba(255, 245, 250, 0.8); 
      backdrop-filter: blur(12px); 
      -webkit-backdrop-filter: blur(12px); 
      border-radius: 48px 20px 48px 20px; 
      box-shadow: 0 20px 40px -10px #ff66a5, 0 0 0 3px rgba(255,255,255,0.7) inset; 
      padding: 24px 18px; 
      max-width: 400px; /* оптимально для телефона */ 
      width: 100%; 
      text-align: center; 
      border: 2px solid rgba(255,255,255,0.8); 
    } 
 
    h2 { 
      font-size: clamp(2rem, 7vw, 2.8rem); 
      font-weight: 700; 
      background: linear-gradient(135deg, #b32e62, #d9145e); 
      -webkit-background-clip: text; 
      background-clip: text; 
      color: transparent; 
      margin-bottom: 16px; 
      text-shadow: 0 0 10px #ffb0d0; 
      line-height: 1.2; 
    } 
 
    /* КНОПКА — адаптивная, пульсирует */ 
    button { 
      background: #ffb3d9; 
      border: 3px solid white; 
      border-radius: 60px; 
      padding: 14px 24px; 
      font-size: 1.3rem; 
      font-weight: 600; 
      color: #9f2b5e; 
      box-shadow: 0 10px 0 #c43b7a, 0 15px 20px #ff99cc; 
      cursor: pointer; 
      transition: 0.15s; 
      text-transform: uppercase; 
      letter-spacing: 1.5px; 
      backdrop-filter: blur(4px); 
      margin-bottom: 24px; 
      width: 90%; 
      max-width: 300px; 
      animation: pulse-button 2s infinite ease-in-out; 
    } 
 
    @keyframes pulse-button { 
      0% { transform: scale(1); } 
      50% { transform: scale(1.05); } 
      100% { transform: scale(1); } 
    } 
 
    button:hover { 
      animation: none; 
      transform: scale(1.02) translateY(-2px); 
      box-shadow: 0 8px 0 #c43b7a, 0 20px 25px #ff80b3; 
    } 
 
    button:active { 
      transform: translateY(6px); 
      box-shadow: 0 4px 0 #b02b64, 0 15px 20px #ff99cc; 
    } 
 
    /* ===== ВАЛЕНТИНКА ===== */ 
    #card { 
      background: rgba(255, 250, 250, 0.9); 
      backdrop-filter: blur(8px); 
      border-radius: 40px 16px 40px 16px; 
      padding: 20px 14px; 
      box-shadow: 0 15px 25px -5px #ff66a5, 0 -5px 0 #ffb3d1 inset, 0 0 0 2px white; 
      display: none; 
      flex-direction: column; 
      align-items: center; 
      gap: 12px; 
      opacity: 0; 
      transform: scale(0.9); 
      transition: opacity 0.4s ease, transform 0.4s ease; 
      border: 2px solid #ffe2f0; 
      width: 100%; 
    } 
 
    #card.show { 
      display: flex; 
      opacity: 1; 
      transform: scale(1); 
    } 
 
    /* картинка — уменьшена для телефона */ 
    #card img { 
      max-width: 140px; 
      width: 100%; 
      border-radius: 40% 15% 40% 15%; 
      box-shadow: 0 12px 20px #ff87b5, 0 0 0 4px #ffe6f2; 
      background: white; 
      padding: 5px; 
      border: 2px solid white; 
    } 
 
    /* текст признания */ 
    .love-message { 
      font-family: 'Dancing Script', cursive; 
      background: rgba(255, 230, 245, 0.9); 
      border-radius: 30px 8px 30px 8px; 
      padding: 16px 12px; 
      border: 2px dashed #ff99bb; 
      box-shadow: 0 6px 0 #f7a9c7; 
      width: 100%; 
    } 
 
    .love-line { 
      font-size: 1.5rem;  /* комфортный размер на телефоне */ 
      color: #a52d62; 
      font-weight: 600; 
      line-height: 1.3; 
      text-shadow: 1px 1px 0 #ffe2f0; 
      word-break: break-word; 
      margin: 6px 0; 
    } 
 
    .love-line:first-child { 
      font-size: 1.8rem; 
    } 
 
    /* подписи от/кому */ 
    #card > p { 
      font-size: 1.3rem; 
      background: #fff0f7; 
      padding: 8px 16px; 
      border-radius: 40px; 
      box-shadow: 0 4px 0 #f8a5c3; 
      color: #b32d6a; 
      font-weight: 600; 
      border: 2px solid white;

width: 100%; 
      display: flex; 
      justify-content: center; 
      flex-wrap: wrap; 
      gap: 4px; 
    } 
 
    #card p strong { 
      color: #e6327a; 
      font-size: 1.5rem; 
    } 
 
    /* финальная адаптация для совсем маленьких (до 360px) */ 
    @media (max-width: 380px) { 
      .container { padding: 16px 10px; } 
      h2 { font-size: 1.8rem; } 
      button { font-size: 1.1rem; padding: 12px 16px; } 
      .love-line { font-size: 1.2rem; } 
      .love-line:first-child { font-size: 1.5rem; } 
      #card p { font-size: 1.1rem; } 
      #card p strong { font-size: 1.3rem; } 
    } 
  </style> 
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&display=swap" rel="stylesheet"> 
</head> 
<body> 
  <!-- огромное бьющееся сердце --> 
  <div class="giant-heart" id="giantHeart">❤️</div> 
 
  <!-- фон с плывущими сердечками (их теперь меньше и они нежные) --> 
  <div class="floating-hearts" aria-hidden="true"> 
    <span class="heart-emoji">❤️</span> <span class="heart-emoji">💖</span> <span class="heart-emoji">💗</span> 
    <span class="heart-emoji">💓</span> <span class="heart-emoji">💞</span> <span class="heart-emoji">💕</span> 
    <span class="heart-emoji">❣️</span> <span class="heart-emoji">💘</span> <span class="heart-emoji">💝</span> 
    <span class="heart-emoji">💟</span> <span class="heart-emoji">💌</span> <span class="heart-emoji">🩷</span> 
  </div> 
 
  <div class="container"> 
    <h2>С Днём святого Валентина!</h2> 
    <button onclick="revealCard()">✨ Открыть ✨</button> 
 
    <div id="card"> 
      <img src="assets/love.gif" alt="Сердце"> 
 
      <div class="love-message"> 
        <div class="love-line">Моя любимая Настя ❤️</div> 
        <div class="love-line">Ты — моё счастье, мой свет и причина улыбок.</div> 
        <div class="love-line">Я люблю тебя бесконечно!</div> 
      </div> 
 
      <p><strong>От:</strong> Алексей</p> 
      <p><strong>Кому:</strong> Настя ❤️</p> 
    </div> 
  </div> 
 
  <script> 
    function revealCard() { 
      const card = document.getElementById('card'); 
      const giantHeart = document.getElementById('giantHeart'); 
       
      card.classList.add('show'); 
      giantHeart.classList.add('beat'); 
    } 
  </script> 
</body> 
</html>
