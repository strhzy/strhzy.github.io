<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Валентинка ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>С Днём Святого Валентина!</h2>
    <button onclick="revealCard()">Открыть валентинку</button>

    <div id="card">
      <img src="assets/love.gif" alt="Сердце">
      <p><strong>От:</strong> Алексей</p>
      <p><strong>Кому:</strong> Настя ❤️</p>
    </div>
  </div>

  <script>
    function revealCard() {
      const card = document.getElementById('card');
      card.classList.add('show');
    }
  </script>
</body>
</html>
