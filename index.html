<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Валентинка · Моей Насте</title>
  <style>
    /* ===== СБРОС И БАЗОВАЯ ГАРМОНИЯ ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Dancing Script', 'Segoe UI', 'Brush Script MT', cursive, system-ui, sans-serif;
      padding: 16px;
      background: radial-gradient(circle at 30% 30%, #ffe4f2, #ffb3c6);
      position: relative;
    }

    /* ===== АНИМИРОВАННЫЙ ФОН – РОЗОВЫЙ ВИХРЬ СЕРДЕЦ ===== */
    .floating-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart-emoji {
      position: absolute;
      bottom: -10%;
      font-size: clamp(1.4rem, 6vw, 4rem);
      animation: floatUp 14s linear infinite;
      user-select: none;
      filter: drop-shadow(0 8px 15px rgba(255, 105, 180, 0.4));
      opacity: 0.5;
      will-change: transform, opacity;
    }

    /* Разнообразие: размер, длительность, задержка, оттенки */
    .heart-emoji:nth-child(1) { left: 2%; animation-duration: 16s; animation-delay: 0s; font-size: 3rem; opacity: 0.5; }
    .heart-emoji:nth-child(2) { left: 10%; animation-duration: 19s; animation-delay: 2s; font-size: 2.2rem; opacity: 0.6; }
    .heart-emoji:nth-child(3) { left: 18%; animation-duration: 13s; animation-delay: 0.5s; font-size: 4rem; opacity: 0.3; }
    .heart-emoji:nth-child(4) { left: 27%; animation-duration: 22s; animation-delay: 1.2s; font-size: 2.8rem; opacity: 0.7; }
    .heart-emoji:nth-child(5) { left: 35%; animation-duration: 17s; animation-delay: 3.5s; font-size: 3.5rem; opacity: 0.4; }
    .heart-emoji:nth-child(6) { left: 43%; animation-duration: 20s; animation-delay: 0.9s; font-size: 2.5rem; opacity: 0.8; }
    .heart-emoji:nth-child(7) { left: 52%; animation-duration: 14s; animation-delay: 2.7s; font-size: 4.2rem; opacity: 0.3; }
    .heart-emoji:nth-child(8) { left: 60%; animation-duration: 18s; animation-delay: 1.8s; font-size: 3rem; opacity: 0.6; }
    .heart-emoji:nth-child(9) { left: 68%; animation-duration: 21s; animation-delay: 4s; font-size: 2.2rem; opacity: 0.7; }
    .heart-emoji:nth-child(10) { left: 76%; animation-duration: 15s; animation-delay: 0.2s; font-size: 3.8rem; opacity: 0.4; }
    .heart-emoji:nth-child(11) { left: 84%; animation-duration: 23s; animation-delay: 3s; font-size: 2rem; opacity: 0.9; }
    .heart-emoji:nth-child(12) { left: 92%; animation-duration: 18s; animation-delay: 1.3s; font-size: 4.5rem; opacity: 0.3; }
    .heart-emoji:nth-child(13) { left: 6%; animation-duration: 25s; animation-delay: 2.2s; font-size: 2.6rem; opacity: 0.5; }
    .heart-emoji:nth-child(14) { left: 48%; animation-duration: 16s; animation-delay: 3.8s; font-size: 3.2rem; opacity: 0.6; }
    .heart-emoji:nth-child(15) { left: 80%; animation-duration: 19s; animation-delay: 0.7s; font-size: 3.9rem; opacity: 0.4; }
    .heart-emoji:nth-child(16) { left: 23%; animation-duration: 22s; animation-delay: 5s; font-size: 2.8rem; opacity: 0.5; }
    .heart-emoji:nth-child(17) { left: 55%; animation-duration: 14s; animation-delay: 2.5s; font-size: 4.8rem; opacity: 0.2; }
    .heart-emoji:nth-child(18) { left: 71%; animation-duration: 20s; animation-delay: 0.1s; font-size: 2.2rem; opacity: 0.8; }
    .heart-emoji:nth-child(19) { left: 39%; animation-duration: 17s; animation-delay: 4.3s; font-size: 3.5rem; opacity: 0.5; }
    .heart-emoji:nth-child(20) { left: 95%; animation-duration: 24s; animation-delay: 1.5s; font-size: 2rem; opacity: 0.7; }
    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.9);
        opacity: 0.2;
      }
      30% {
        transform: translateY(-30vh) rotate(8deg) scale(1.2);
        opacity: 0.7;
      }
      70% {
        transform: translateY(-70vh) rotate(-5deg) scale(1.1);
        opacity: 0.5;
      }
      100% {
        transform: translateY(-120vh) rotate(10deg) scale(0.7);
        opacity: 0;
      }
    }

    /* ===== ГЛАВНАЯ КАРТОЧКА (СТЕКЛО + РОЗОВОЕ СИЯНИЕ) ===== */
    .container {
      position: relative;
      z-index: 10;
      background: rgba(255, 240, 250, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 60px 30px 60px 30px;
      box-shadow: 0 30px 50px -10px #ff3388,
                  0 0 0 4px rgba(255, 255, 255, 0.7) inset,
                  0 0 30px #ffb6d9;
      padding: 36px 28px;
      max-width: 650px;
      width: 100%;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.9);
      transition: 0.4s ease-in-out;
    }

    /* капелька мерцания */
    .container:hover {
      box-shadow: 0 40px 60px -8px #ff1a75, 0 0 0 5px rgba(255, 255, 255, 0.9) inset;
    }

    h2 {
      font-size: clamp(2.4rem, 8vw, 3.8rem);
      font-weight: 700;
      background: linear-gradient(135deg, #b32e62, #d9145e, #ff80b3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 20px;
      text-shadow: 0 0 15px #ffa6c9;
      letter-spacing: 1.5px;
      font-family: 'Dancing Script', cursive;
    }

    /* КНОПКА – ЖЕМЧУЖИНА */
    button {
      background: #ffb3d9;
      border: 4px solid white;
      border-radius: 80px;
      padding: 18px 42px;
      font-size: 1.7rem;
      font-weight: bold;
      color: #9f2b5e;
      box-shadow: 0 12px 0 #c43b7a, 0 20px 25px #ff99cc;
      cursor: pointer;
      transition: 0.15s;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      backdrop-filter: blur(5px);
      margin-bottom: 32px;
      font-family: 'Segoe UI', cursive, sans-serif;
      transform: scale(1);
    }

    button:hover {
      transform: scale(1.03) translateY(-4px);
      box-shadow: 0 8px 0 #c43b7a, 0 28px 30px #ff80b3;
      background: #ffc2e0;
    }

    button:active {
      transform: translateY(8px);
      box-shadow: 0 4px 0 #b02b64, 0 15px 20px #ff99cc;
    }

    /* САМА ВАЛЕНТИНКА (ПОЯВЛЯЕТСЯ) */
    #card {
      background: rgba(255, 250, 250, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 50px 20px 50px 20px;
      padding: 30px 20px 30px 20px;
      box-shadow: 0 20px 30px -5px #ff66a5, 0 -8px 0 #ffb3d1 inset, 0 0 0 3px white;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      opacity: 0;
      transform: scale(0.85) rotate(-0.5deg);
      transition: opacity 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.5s ease;
      border: 2px solid #ffe2f0;
    }

    #card.show {
      display: flex;
      opacity: 1;
      transform: scale(1) rotate(0);
    }

    /* картинка — стала ещё нежнее */
    #card img {
      max-width: 200px;
      width: 100%;
      border-radius: 50% 20% 50% 20%;
      box-shadow: 0 20px 25px #ff87b5, 0 0 0 6px #ffe6f2;
      background: white;
      padding: 8px;
      border: 3px solid white;
      transition: 0.3s;
    }

    #card img:hover {
      transform: scale(1.02);
      box-shadow: 0 25px 30px #ff6a9f;
    }

    /* БЛОК ТЕКСТА — НОВОЕ ПРИЗНАНИЕ */
    .love-message {
      font-family: 'Dancing Script', 'Segoe UI', cursive;
      background: rgba(255, 225, 240, 0.8);
      border-radius: 40px 12px 40px 12px;
      padding: 22px 18px;
      margin: 8px 0;
      border: 3px dashed #ff99bb;
      box-shadow: 0 10px 0 #f7a9c7;
      width: 100%;
    }

    .love-message p {
      font-size: 1.9rem;
      color: #a52d62;
      font-weight: 600;
      line-height: 1.4;
      text-shadow: 2px 2px 0 #ffe2f0;
      word-break: break-word;
    }.love-message p:first-child {
      font-size: 2.1rem;
      margin-bottom: 8px;
      color: #bf3773;
    }

    .love-message p:last-child {
      font-size: 1.7rem;
      font-style: italic;
    }

    /* подписи от/кому — элегантно */
    #card > p {
      font-size: 1.8rem;
      background: #fff0f7;
      padding: 12px 32px;
      border-radius: 60px;
      box-shadow: 0 7px 0 #f8a5c3;
      color: #b32d6a;
      font-weight: 600;
      border: 3px solid white;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
      font-family: 'Segoe UI', cursive, sans-serif;
    }

    #card p strong {
      color: #e6327a;
      margin-right: 5px;
      font-size: 2rem;
    }

    /* адаптация для экранов поменьше */
    @media (max-width: 500px) {
      .container {
        padding: 24px 14px;
      }
      .love-message p {
        font-size: 1.5rem;
      }
      .love-message p:first-child {
        font-size: 1.7rem;
      }
      #card > p {
        font-size: 1.4rem;
        padding: 8px 14px;
      }
      button {
        font-size: 1.3rem;
        padding: 14px 25px;
      }
    }
  </style>
  <!-- подключаем красивый шрифт для текста признания -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- анимированные сердечки разных оттенков (фон) -->
  <div class="floating-hearts" aria-hidden="true">
    <span class="heart-emoji">❤️</span> <span class="heart-emoji">🧡</span> <span class="heart-emoji">💛</span>
    <span class="heart-emoji">💚</span> <span class="heart-emoji">💙</span> <span class="heart-emoji">💜</span>
    <span class="heart-emoji">🤍</span> <span class="heart-emoji">💖</span> <span class="heart-emoji">💗</span>
    <span class="heart-emoji">💓</span> <span class="heart-emoji">💞</span> <span class="heart-emoji">💕</span>
    <span class="heart-emoji">❣️</span> <span class="heart-emoji">❤️‍🔥</span> <span class="heart-emoji">💘</span>
    <span class="heart-emoji">💝</span> <span class="heart-emoji">💟</span> <span class="heart-emoji">💌</span>
    <span class="heart-emoji">💋</span> <span class="heart-emoji">🩷</span>
  </div>

  <div class="container">
    <h2>С Днём всех влюблённых!</h2>
    <button onclick="revealCard()">✨ Открыть сердце ✨</button>

    <div id="card">
      <!-- та же картинка (путь сохранён) -->
      <img src="assets/love.gif" alt="Сердце бьётся для тебя">

      <!-- ✨ НОВЫЙ ПРЕКРАСНЫЙ ТЕКСТ ✨ -->
      <div class="love-message">
        <p>Моя любимая Настя ❤️</p>
        <p>Ты — самое нежное утро,<br>самый тёплый вечер и причина моей улыбки.<br>Я так счастлив, что ты есть.</p>
        <p>С каждым днём люблю сильнее!</p>
      </div>

      <!-- исходные подписи (от / кому) остались, стали ещё красивее -->
      <p><strong>От:</strong> Алексей</p>
      <p><strong>Кому:</strong> Настя ❤️</p>
    </div>
  </div>

  <script>
    function revealCard() {
      const card = document.getElementById('card');
      card.classList.add('show');
    }
  </script>
</body>
</html>
